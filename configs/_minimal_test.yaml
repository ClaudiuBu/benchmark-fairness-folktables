experiment:
  name: "minimal_test"
  type: "benchmark"
  data_type: "folktables"

data:
  task: "income"
  states: ["CA"]
  mode: "temporal"
  frequency: "quarter"
  train_years: [2014]
  val_years: [2014]
  test_years: [2015,2016]
  sensitive_attribute: "SEX"
  max_samples: null
  max_samples_per_year: null

methods:
  - baseline

maintenance_strategies:
  - "no-retrain"
  - "retrain"

seeds: [0,1,2,3]
threshold_grid: [0.5]

fairness_constraint:
  num_iters: 2
  lr: 0.1

output:
  dir: "results/folktables/minimal_test"
