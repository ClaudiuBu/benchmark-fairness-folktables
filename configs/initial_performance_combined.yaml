inputs:
  income_base_dir: "results/folktables/benchmark_temporal/folktables_benchmark_temporal"
  employment_base_dir: "results/folktables/benchmark_temporal_employment/folktables_benchmark_temporal_employment"
  income_race_dir: "results/folktables/benchmark_temporal_race/folktables_benchmark_temporal_race"
  employment_race_dir: "results/folktables/benchmark_temporal_employment_race/folktables_benchmark_temporal_employment_race"

selection:
  method: "baseline"
  maintenance: "no-retrain"
  sensitive_attributes:
    sex: "SEX"
    race: "RAC1P"
  performance_metrics:
    - "auc"
    - "brier_score"
    - "accuracy"
    - "sensitivity"
    - "f1_score"
    - "oe_gap"

output:
  path: "results/folktables/tables/initial_performance_combined.tex"